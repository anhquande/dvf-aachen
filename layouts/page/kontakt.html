{{ define "main" }}
<article class="page-single container">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="page-content">
    {{ .Content }}
    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">E-Mail *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Kommentar oder Nachricht *</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <p style="font-size: 13px; color: #666; margin-bottom: 16px;">
        Durch Nutzung dieses Kontaktformulars stimmen Sie unserer
        <a href="/datenschutz/">Datenschutzerklärung</a> zu.
      </p>
      <button type="submit" class="form-submit">Absenden</button>
    </form>
  </div>
</article>
{{ end }}
