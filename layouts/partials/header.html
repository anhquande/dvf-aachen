<header class="site-header">
  <div class="header-inner">
    <div class="site-branding">
      <a href="{{ "/" | relURL }}" class="logo-link">
        <img src="{{ .Site.Params.logo | relURL }}" alt="DVF Aachen" class="site-logo">
      </a>
      <div class="site-title-wrap">
        <h1 class="site-title"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
      </div>
    </div>
    <button class="menu-toggle" aria-label="Menü" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <ul class="nav-list">
        {{ range .Site.Menus.main }}
          {{ if .HasChildren }}
            <li class="has-children">
              <a href="{{ .URL }}">{{ .Name }}</a>
              <ul class="sub-menu">
                {{ range .Children }}
                  <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                {{ end }}
              </ul>
            </li>
          {{ else if not .Parent }}
            <li><a href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
